<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · 866 JACK LAW</title>
    <style>
      * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: 2rem 1.5rem calc(2rem + env(safe-area-inset-bottom));
        background: #000;
        color: #fff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
        text-align: center;
      }
      img { width: 88px; height: 88px; border-radius: 4px; }
      h1 { font-size: 1.125rem; font-weight: 700; margin: 0; }
      p { margin: 0; font-size: 0.875rem; line-height: 1.5; color: rgba(255, 255, 255, 0.6); max-width: 20rem; }
      .es { color: rgba(255, 255, 255, 0.4); font-size: 0.8125rem; }
      a.call {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        margin-top: 0.5rem;
        padding: 0.875rem 1.5rem;
        border-radius: 0.75rem;
        background: #e07820;
        color: #fff;
        font-weight: 600;
        font-size: 0.9375rem;
        text-decoration: none;
      }
      button.retry {
        margin-top: 0.25rem;
        background: none;
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: rgba(255, 255, 255, 0.7);
        padding: 0.625rem 1.25rem;
        border-radius: 0.75rem;
        font-size: 0.8125rem;
        font-family: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <img src="/logo.png" alt="866 JACK LAW" />
    <h1>You're offline</h1>
    <p>The portal needs an internet connection. Reconnect and try again.</p>
    <p class="es">Estás sin conexión. El portal necesita conexión a internet.</p>
    <a class="call" href="tel:+18665225529">Call 866-JACK-LAW</a>
    <button class="retry" onclick="location.reload()">Try again · Reintentar</button>
  </body>
</html>
